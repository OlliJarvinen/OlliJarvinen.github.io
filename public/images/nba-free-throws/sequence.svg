<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img"><title>Second attempts are more accurate</title><rect width="1120" height="520" fill="#f4f1e8"/><g font-family="Arial, sans-serif" fill="#233c37"><text x="64" y="65" font-size="14" letter-spacing="2">NBA FREE THROW STUDY / 2000–01 TO 2024–25</text><text x="64" y="120" font-size="35" font-weight="bold">Second attempts are more accurate</text><text x="64" y="155" font-size="17">Second minus first attempt · 579,543 matched complete two-shot trips</text><line x1="400.0" x2="400.0" y1="200" y2="405" stroke="#8a928a"/><text x="400.0" y="440" text-anchor="middle" font-size="15">+0</text><line x1="493.3333333333333" x2="493.3333333333333" y1="200" y2="405" stroke="#d9d9cc"/><text x="493.3333333333333" y="440" text-anchor="middle" font-size="15">+1</text><line x1="586.6666666666666" x2="586.6666666666666" y1="200" y2="405" stroke="#d9d9cc"/><text x="586.6666666666666" y="440" text-anchor="middle" font-size="15">+2</text><line x1="680.0" x2="680.0" y1="200" y2="405" stroke="#d9d9cc"/><text x="680.0" y="440" text-anchor="middle" font-size="15">+3</text><line x1="773.3333333333333" x2="773.3333333333333" y1="200" y2="405" stroke="#d9d9cc"/><text x="773.3333333333333" y="440" text-anchor="middle" font-size="15">+4</text><line x1="866.6666666666667" x2="866.6666666666667" y1="200" y2="405" stroke="#d9d9cc"/><text x="866.6666666666667" y="440" text-anchor="middle" font-size="15">+5</text><line x1="960.0" x2="960.0" y1="200" y2="405" stroke="#d9d9cc"/><text x="960.0" y="440" text-anchor="middle" font-size="15">+6</text><text x="64" y="251" font-size="19">Within-trip accuracy gain</text><line x1="817.2" x2="850.8" y1="245" y2="245" stroke="#28665f" stroke-width="4"/><circle cx="834.0" cy="245" r="7" fill="#28665f"/><text x="1000" y="251" font-size="20" fill="#28665f">+4.65</text><text x="680" y="480" text-anchor="middle" font-size="16">Percentage points · bars show 95% intervals</text></g></svg>